name: 3. Compile And Sign Custom Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/*.m'  
      - 'source/*.x'  
      - 'source/*.xm'
      - 'source/*.c'

jobs:
  build_and_sign:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Ultimate Master Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/ios_master_env
          key: ios-master-cache-latest-run
          restore-keys: |
            ios-master-cache-

      - name: Add Arsenal to PATH
        run: echo "$HOME/ios_master_env/tools" >> $GITHUB_PATH

      - name: Compile Code to Dylib (With Logos & Substrate)
        run: |
          APPLE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          THEOS_INCLUDE="$HOME/ios_master_env/theos/include"

          echo "تحميل مكتبة Fishhook..."
          curl -L -s -o source/fishhook.h https://raw.githubusercontent.com/facebook/fishhook/master/fishhook.h
          curl -L -s -o source/fishhook.c https://raw.githubusercontent.com/facebook/fishhook/master/fishhook.c

          echo "تحميل أداة Logos..."
          git clone https://github.com/theos/logos.git logos_tool || true

          echo "إنشاء ملف substrate.h محلياً..."
          mkdir -p theos_headers
          cat << 'EOF' > theos_headers/substrate.h
          #ifndef SUBSTRATE_H
          #define SUBSTRATE_H
          #include <objc/runtime.h>
          #include <objc/message.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          void MSHookMessageEx(Class _class, SEL sel, IMP imp, IMP *result);
          void MSHookFunction(void *symbol, void *replace, void **result);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

          echo "إنشاء ملف CydiaSubstrate.tbd محلياً لإصلاح خطأ Linker..."
          cat << 'EOF' > CydiaSubstrate.tbd
          ---
          archs:           [ armv7, armv7s, arm64, arm64e ]
          platform:        ios
          install-name:    /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate
          current-version: 0.0.0
          compatibility-version: 0.0.0
          exports:
            - archs:            [ armv7, armv7s, arm64, arm64e ]
              symbols:          [ _MSGetImageByName, _MSFindSymbol, _MSHookFunction, _MSHookMessageEx ]
          ...
          EOF

          echo "تحويل ملفات Logos (.x / .xm) إلى Objective-C..."
          shopt -s nullglob
          for file in source/*.x source/*.xm; do
            if [ -f "$file" ]; then
              echo "Processing $file..."
              perl logos_tool/bin/logos.pl "$file" > "${file}.m"
            fi
          done

          echo "Using Official Apple SDK: $APPLE_SDK"

          # بناء الملفات النهائية
          clang -dynamiclib -arch arm64 -isysroot $APPLE_SDK \
            -miphoneos-version-min=14.0 \
            -I$THEOS_INCLUDE \
            -Itheos_headers \
            -include objc/runtime.h \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -install_name @rpath/MyCustomTweak.dylib \
            CydiaSubstrate.tbd \
            -o MyCustomTweak.dylib source/*.m source/*.c
            
          echo "تم بناء الـ Dylib بنجاح!"

      - name: Install Dependencies & Sign
        run: |
          brew install ldid
          ldid -S MyCustomTweak.dylib
          echo "تم التوقيع بنجاح!"
          
      - name: Upload Final Signed Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Ready-To-Use-Signed-Dylib
          path: MyCustomTweak.dylib
