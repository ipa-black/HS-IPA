name: Build IPA BLACK Tweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 📥 سحب الكود (Checkout Code)
        uses: actions/checkout@v4

      - name: ⚙️ تثبيت بيئة Theos و SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
          rm -rf ${{ github.workspace }}/theos/sdks
          git clone https://github.com/theos/sdks.git ${{ github.workspace }}/theos/sdks

      - name: 📝 إنشاء ملفات البناء تلقائياً (Auto-Generate Files)
        run: |
          # 1. إنشاء ملف Makefile
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:13.0
          ARCHS = arm64
          DEBUG = 0
          FINALPACKAGE = 1
          
          TWEAK_NAME = IPABLACK
          
          IPABLACK_FILES = Tweak.xm
          IPABLACK_FRAMEWORKS = UIKit
          IPABLACK_CFLAGS = -fobjc-arc
          
          include $(THEOS)/makefiles/common.mk
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          
          # 2. إنشاء ملف control
          cat << 'EOF' > control
          Package: com.ipablack.mod
          Name: IPA BLACK Premium
          Depends: mobilesubstrate
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: IPA BLACK Premium Mod
          Maintainer: IPA BLACK
          Author: IPA BLACK
          Section: Tweaks
          EOF
          
          # 3. إنشاء ملف PliST الخاص باللعبة
          cat << 'EOF' > IPABLACK.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.miniclip.8ballpoolmult</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF

      - name: 🔨 بناء المود (Compile Tweak)
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1

      - name: 📦 رفع الملفات الجاهزة (Upload Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: IPA_BLACK_Build
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
