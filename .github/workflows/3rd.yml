name: 3. Compile And Sign Custom Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/*.m'  
      - 'source/*.x'  
      - 'source/*.xm'
      - 'source/*.c'

jobs:
  build_and_sign:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Ultimate Master Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/ios_master_env
          key: ios-master-cache-latest-run
          restore-keys: |
            ios-master-cache-

      - name: Add Arsenal to PATH
        run: echo "$HOME/ios_master_env/tools" >> $GITHUB_PATH

      - name: Compile Code to Dylib (With Logos & Substrate)
        run: |
          APPLE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          THEOS_INCLUDE="$HOME/ios_master_env/theos/include"

          echo "تحميل مكتبة Fishhook لاختراق حماية C العميقة..."
          curl -L -s -o source/fishhook.h https://raw.githubusercontent.com/facebook/fishhook/master/fishhook.h
          curl -L -s -o source/fishhook.c https://raw.githubusercontent.com/facebook/fishhook/master/fishhook.c

          echo "تحميل أداة Logos كاملة مع مكاتبها الأساسية..."
          git clone https://github.com/theos/logos.git logos_tool

          echo "تحميل CydiaSubstrate الأساسية لعمل الـ Hooks..."
          curl -L -s -o CydiaSubstrate.tbd https://raw.githubusercontent.com/theos/theos/master/vendor/lib/CydiaSubstrate.tbd

          echo "تحويل ملفات Logos (.x / .xm) إلى Objective-C..."
          shopt -s nullglob
          for file in source/*.x source/*.xm; do
            echo "Processing $file..."
            # استخدام الأداة من المجلد المستنسخ لضمان وجود كل المكاتب
            perl logos_tool/bin/logos.pl "$file" > "${file}.m"
          done

          echo "Using Official Apple SDK: $APPLE_SDK"

          # بناء جميع الملفات مع ربط CydiaSubstrate
          clang -dynamiclib -arch arm64 -isysroot $APPLE_SDK \
            -miphoneos-version-min=14.0 \
            -I$THEOS_INCLUDE \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -install_name @rpath/MyCustomTweak.dylib \
            CydiaSubstrate.tbd \
            -o MyCustomTweak.dylib source/*.m source/*.x.m source/*.xm.m source/*.c 2>/dev/null || true
            
          # إعادة البناء بشكل آمن لتجنب أخطاء Clang
          clang -dynamiclib -arch arm64 -isysroot $APPLE_SDK \
            -miphoneos-version-min=14.0 \
            -I$THEOS_INCLUDE \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -install_name @rpath/MyCustomTweak.dylib \
            CydiaSubstrate.tbd \
            -o MyCustomTweak.dylib source/*.m source/*.c
            
          echo "تم بناء الـ Dylib بنجاح!"

      - name: Install Dependencies & Sign
        run: |
          brew install ldid
          ldid -S MyCustomTweak.dylib
          echo "تم التوقيع بنجاح!"
          
      - name: Upload Final Signed Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Ready-To-Use-Signed-Dylib
          path: MyCustomTweak.dylib
