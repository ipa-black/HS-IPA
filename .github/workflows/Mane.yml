
name: Build MWDebugMonitor Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "MWDebugMonitor.xm"
      - "Makefile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" \
            >> "$GITHUB_ENV"

      - name: Configure iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          ln -s "$SDK" \
            "$THEOS/sdks/iPhoneOS.sdk"

      - name: Build Dylib
        run: |
          set -euo pipefail
          make clean
          make FINALPACKAGE=1 \
            ARCHS=arm64 \
            DEBUG=0

      - name: Collect Dylib
        run: |
          set -euo pipefail

          mkdir -p output

          FILE=$(find .theos \
            -name "MWDebugMonitor.dylib" \
            -type f | head -n 1)

          test -n "$FILE"

          cp "$FILE" \
            output/MWDebugMonitor.dylib

          file output/MWDebugMonitor.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MWDebugMonitor-iOS-ARM64
          path: output/MWDebugMonitor.dylib
          if-no-files-found: error
