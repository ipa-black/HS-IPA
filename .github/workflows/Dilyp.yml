name: iOS Master Compiler with Smart Cache

on:
  workflow_dispatch:
    inputs:
      code_b64:
        description: 'Objective-C Code (Base64)'
        required: true
      session_id:
        description: 'Session ID'
        required: true
      extra_libs_url:
        description: 'رابط مباشر لملف zip للمكتبات الخارجية (اختياري)'
        required: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Decode Source Code
        run: echo "${{ github.event.inputs.code_b64 }}" | base64 --decode > tweak.m

      - name: Setup Smart Cache for External Libraries
        id: cache-ios-libs
        uses: actions/cache@v4
        with:
          path: ~/ios_custom_libs
          key: ios-libs-cache-v1 

      - name: Download Missing Dependencies (If not cached)
        run: |
          mkdir -p ~/ios_custom_libs/include
          mkdir -p ~/ios_custom_libs/lib
          
          echo "🔍 فحص الكاش..."
          
          # تحميل المكتبات المخصصة إذا تم تمرير رابط
          EXTRA_URL="${{ github.event.inputs.extra_libs_url }}"
          if [ ! -z "$EXTRA_URL" ]; then
            echo "📥 جاري تحميل مكتبات إضافية من الرابط..."
            curl -L "$EXTRA_URL" -o temp_libs.zip
            unzip -o temp_libs.zip -d ~/ios_custom_libs/
            rm temp_libs.zip
          fi

          # تحميل الهيدرز الأساسية (Substrate) إذا لم تكن موجودة
          if [ ! -f "~/ios_custom_libs/include/substrate.h" ]; then
            echo "📥 جاري تحميل Substrate Headers الأساسية للكاش..."
            curl -sL "https://raw.githubusercontent.com/theos/headers/master/substrate.h" -o ~/ios_custom_libs/include/substrate.h || true
            curl -sL "https://raw.githubusercontent.com/theos/headers/master/CydiaSubstrate/CydiaSubstrate.h" -o ~/ios_custom_libs/include/CydiaSubstrate.h || true
          else
            echo "✅ المكتبات الأساسية موجودة بالفعل في الكاش!"
          fi

      - name: Compile to Dylib (Using Cached Libs)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -fobjc-arc \
            -isysroot "$SDK_PATH" \
            -arch arm64 \
            -I ~/ios_custom_libs/include \
            -L ~/ios_custom_libs/lib \
            tweak.m -o Payload_${{ github.event.inputs.session_id }}.dylib || exit 1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ github.event.inputs.session_id }}
          path: Payload_${{ github.event.inputs.session_id }}.dylib
          retention-days: 1
