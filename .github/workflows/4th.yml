name: 4. Ultimate Deep Analyzer (Radare2)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'ضع رابط التحميل المباشر لملف الـ IPA هنا'
        required: true
        type: string
      search_keywords:
        description: 'كلمات للبحث عنها لاستخراج الـ Offsets (مثال: Line,Predict,Guide) - مفصولة بفاصلة'
        required: false
        type: string
        default: 'Line,Predict,Guide,Trajectory'

jobs:
  deep_analyze:
    runs-on: macos-latest
    steps:
      - name: 1. Download Target IPA
        run: |
          echo "جاري تحميل التطبيق من الرابط المرفق..."
          curl -L "${{ github.event.inputs.ipa_url }}" -o target_app.ipa
          
      - name: 2. Extract IPA & Locate Core Binary
        id: locate
        run: |
          echo "جاري فك ضغط التطبيق والبحث عن الملف التنفيذي الأساسي..."
          unzip -q target_app.ipa -d extracted_ipa/
          cd extracted_ipa/Payload
          
          # استخراج اسم المجلد الذي ينتهي بـ .app
          APP_DIR=$(ls -d *.app | head -n 1)
          
          # اسم الملف التنفيذي يكون عادة نفس اسم المجلد بدون .app
          BINARY_NAME=$(basename "$APP_DIR" .app)
          
          # حفظ المسار الكامل للملف التنفيذي
          BINARY_PATH="extracted_ipa/Payload/$APP_DIR/$BINARY_NAME"
          echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT
          
          echo "تم العثور على الملف التنفيذي بنجاح: $BINARY_NAME"

      - name: 3. Install Radare2 (Reverse Engineering Engine)
        run: |
          echo "جاري تثبيت محرك Radare2 للتحليل العكسي..."
          brew install radare2

      - name: 4. Deep Disassembly & Extraction
        run: |
          mkdir -p Deep_Analysis_Results
          BINARY="${{ steps.locate.outputs.binary_path }}"
          
          echo "استخراج الكلاسات والدوال المخفية (Obj-C & C++)..."
          rabin2 -O "$BINARY" > Deep_Analysis_Results/1_Classes_And_Methods.txt || echo "لا توجد كلاسات واضحة"
          
          echo "استخراج عناوين الذاكرة الدقيقة (Offsets / Symbols)..."
          rabin2 -s "$BINARY" > Deep_Analysis_Results/2_Symbols_And_Offsets.txt || echo "فشل استخراج الرموز"
          
          echo "استخراج النصوص الحية (Strings)..."
          rabin2 -z "$BINARY" > Deep_Analysis_Results/3_Strings.txt || echo "فشل استخراج النصوص"

      - name: 5. Filter Targets by Keywords
        if: ${{ github.event.inputs.search_keywords != '' }}
        run: |
          echo "جاري البحث عن الكلمات المفتاحية المطلوبة وفلترة النتائج..."
          
          # تقسيم الكلمات المفتاحية بناءً على الفاصلة
          IFS=',' read -ra ADDR <<< "${{ github.event.inputs.search_keywords }}"
          
          for i in "${ADDR[@]}"; do
            echo "======================================" >> Deep_Analysis_Results/4_Filtered_Target_Offsets.txt
            echo "🎯 Results for Keyword: $i" >> Deep_Analysis_Results/4_Filtered_Target_Offsets.txt
            echo "======================================" >> Deep_Analysis_Results/4_Filtered_Target_Offsets.txt
            
            # البحث داخل العناوين والكلاسات
            grep -i "$i" Deep_Analysis_Results/2_Symbols_And_Offsets.txt >> Deep_Analysis_Results/4_Filtered_Target_Offsets.txt || true
            grep -i "$i" Deep_Analysis_Results/1_Classes_And_Methods.txt >> Deep_Analysis_Results/4_Filtered_Target_Offsets.txt || true
            
            echo -e "\n\n" >> Deep_Analysis_Results/4_Filtered_Target_Offsets.txt
          done

      - name: 6. Zip Final Results
        run: zip -r Deep_Analysis_Results.zip Deep_Analysis_Results/
        
      - name: 7. Upload Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Deep-Analysis-Offsets
          path: Deep_Analysis_Results.zip
