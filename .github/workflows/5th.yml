name: Extract Real Offsets

on:
  workflow_dispatch:
    inputs:
      script_url:
        description: 'رابط ملف script.json من Il2CppDumper'
        required: true
        default: 'https://example.com/script.json'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Extract offsets
        env:
          SCRIPT_URL: ${{ github.event.inputs.script_url }}
        shell: python
        run: |
          import requests, json, re, os

          url = os.environ['SCRIPT_URL']
          print(f"Downloading {url}...")
          r = requests.get(url)
          if r.status_code != 200:
              print("Failed to download script.json")
              exit(1)

          data = r.json()

          # الكلمات المفتاحية للبحث عن الرموز المهمة
          keywords = [
              "UserSettingsManager", "VisualCue", "Table",
              "getPositionForPocket", "showCueBallTrajectory",
              "wideGuideline", "tapToAim", "hideGuidelinesMode",
              "maxCuePowerOffset", "FrictionProperties",
              "checkValidCushionShotCollision",
              "SGMSafeGuardManager", "PAGSecManager",
              "aimLineLength", "AimLine", "GuideLine",
              "cueBallPosition", "pocket", "Pocket"
          ]

          found = []

          # البحث في ScriptMetadata أو ScriptMethod حسب بنية script.json
          if isinstance(data, dict):
              # قد يكون الملف يحتوي على "ScriptMethod" أو "ScriptMetadata"
              for section_name in ["ScriptMethod", "ScriptMetadata", "ScriptString", "ScriptTypeDefinition"]:
                  if section_name in data:
                      section = data[section_name]
                      if isinstance(section, list):
                          for item in section:
                              name = item.get("Name", "")
                              addr = item.get("Address", 0)
                              if any(kw.lower() in name.lower() for kw in keywords):
                                  found.append({
                                      "name": name,
                                      "address": hex(addr),
                                      "type": "method" if section_name == "ScriptMethod" else "metadata"
                                  })
                      elif isinstance(section, dict):
                          for name, addr in section.items():
                              if any(kw.lower() in name.lower() for kw in keywords):
                                  found.append({
                                      "name": name,
                                      "address": hex(addr) if isinstance(addr, int) else addr,
                                      "type": "metadata"
                                  })

          # توليد ملف header
          lines = ["// Offsets extracted from script.json", "#pragma once", ""]
          for entry in found:
              define_name = re.sub(r'[^A-Za-z0-9_]', '_', entry["name"]).upper()
              lines.append(f"// {entry['name']} ({entry['type']})")
              lines.append(f"#define {define_name}_OFFSET {entry['address']}")
              lines.append("")

          header_content = "\n".join(lines)

          with open("extracted_offsets.h", "w") as f:
              f.write(header_content)

          with open("extracted_offsets.json", "w") as f:
              json.dump(found, f, indent=2)

          print(f"Found {len(found)} offsets")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-offsets
          path: |
            extracted_offsets.h
            extracted_offsets.json

      - name: Commit to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add extracted_offsets.h extracted_offsets.json
          git commit -m "Update extracted offsets" || echo "No changes"
          git push
