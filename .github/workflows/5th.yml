name: Extract Offsets from Headers

on:
  workflow_dispatch:
    inputs:
      headers_url:
        description: 'رابط ملف الهيدر (zip أو نصي)'
        required: true
        default: 'https://example.com/headers.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Extract offsets
        env:
          URL: ${{ github.event.inputs.headers_url }}
        shell: python
        run: |
          import requests, re, zipfile, io, os, json

          url = os.environ['URL']
          print(f"Downloading {url}...")
          r = requests.get(url)
          if r.status_code != 200:
              print("Failed to download")
              exit(1)
          content = r.content

          files = []
          try:
              z = zipfile.ZipFile(io.BytesIO(content))
              for name in z.namelist():
                  if name.endswith('/'): continue
                  try:
                      data = z.read(name).decode('utf-8', errors='ignore')
                      files.append((name, data))
                  except: pass
          except zipfile.BadZipFile:
              files.append(("single.txt", content.decode('utf-8', errors='ignore')))

          entries = []
          # أنماط للبحث عن العناوين
          pattern_rva = re.compile(r'(?:RVA|Address|Offset)\s*[:=]\s*(0x[0-9A-Fa-f]+)', re.IGNORECASE)
          pattern_name = re.compile(r'([a-zA-Z_]\w*)\s*[;\(]')

          for filepath, data in files:
              for line in data.splitlines():
                  m = pattern_rva.search(line)
                  if not m:
                      # محاولة البحث عن أرقام سداسية كبيرة
                      m = re.search(r'\b(0x[0-9A-Fa-f]{4,})\b', line)
                  if not m:
                      continue
                  addr = m.group(1)
                  nm = pattern_name.search(line)
                  name = nm.group(1) if nm else 'Unknown'
                  entries.append({"name": name, "address": addr, "line": line.strip()})

          # توليد ملف header
          lines = ['// Offsets extracted from headers', '#pragma once', '']
          for e in entries:
              define_name = re.sub(r'[^A-Za-z0-9_]', '_', e['name']).upper()
              lines.append(f"// {e['line']}")
              lines.append(f"#define {define_name}_OFFSET {e['address']}")
              lines.append('')
          header_content = '\n'.join(lines)

          with open('extracted_offsets.h', 'w') as f:
              f.write(header_content)

          # حفظ JSON للمراجعة
          with open('extracted_offsets.json', 'w') as f:
              json.dump(entries, f, indent=2)

          print(f"Extracted {len(entries)} offsets")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offsets
          path: |
            extracted_offsets.h
            extracted_offsets.json

      - name: Commit to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add extracted_offsets.h extracted_offsets.json
          git commit -m "Update extracted offsets" || echo "No changes"
          git push
