name: 5. The XREF Sniper

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'رابط تحميل الـ IPA المباشر'
        required: true
        type: string
      target_string:
        description: 'اسم الكلاس أو النص الذي تبحث عنه (مثال: 17BallLineCollision)'
        required: true
        type: string
        default: '17BallLineCollision'

jobs:
  snipe_offsets:
    runs-on: macos-latest
    steps:
      - name: 1. Download & Extract IPA
        id: locate
        run: |
          curl -L "${{ github.event.inputs.ipa_url }}" -o target.ipa
          unzip -q target.ipa -d extracted/
          
          # إصلاح مشكلة المسار المزدوج
          APP_DIR=$(find extracted/Payload -name "*.app" -type d | head -n 1)
          BINARY_NAME=$(basename "$APP_DIR" .app)
          BINARY_PATH="$APP_DIR/$BINARY_NAME"
          
          echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT

      - name: 2. Install Tools
        run: brew install radare2

      - name: 3. Hunt String Address
        id: hunt
        run: |
          BINARY="${{ steps.locate.outputs.binary_path }}"
          TARGET="${{ github.event.inputs.target_string }}"
          
          echo "البحث عن العنوان الفيزيائي للنص: $TARGET"
          echo "داخل المسار: $BINARY"
          
          # استخراج عنوان النص بصيغة Hex
          STR_ADDR=$(rabin2 -z "$BINARY" | grep -i "$TARGET" | awk '{print $3}')
          
          if [ -z "$STR_ADDR" ]; then
            echo "لم يتم العثور على النص!"
            exit 1
          fi
          
          # تنظيف العنوان ليكون جاهزاً للبحث
          CLEAN_ADDR=$(echo $STR_ADDR | sed 's/0x//g')
          echo "تم العثور على النص في العنوان: $CLEAN_ADDR"
          echo "clean_addr=$CLEAN_ADDR" >> $GITHUB_OUTPUT

            - name: 4. The VTable Hunter Engine
        run: |
          BINARY="${{ steps.locate.outputs.binary_path }}"
          ADDR="${{ steps.hunt.outputs.clean_addr }}"
          
          mkdir -p Sniper_Results
          RES="Sniper_Results/XREF_Result.txt"
          
          echo "🎯 الهدف: البحث المتقدم عن الكلاس (C++ VTable Hunting)" > $RES
          echo "📍 عنوان النص في الذاكرة: 0x$ADDR" >> $RES
          echo "---------------------------------------------------" >> $RES
          
          # 1. البحث عن مؤشر معلومات النوع (TypeInfo)
          echo "🔍 1. البحث عن مؤشر الـ TypeInfo..." >> $RES
          r2 -q -c "/8 0x$ADDR" "$BINARY" > typeinfo.txt
          
          T_HIT=$(cat typeinfo.txt | grep -i "hit" | head -n 1 | awk '{print $1}')
          
          if [ ! -z "$T_HIT" ]; then
             echo "✅ تم العثور على TypeInfo في: $T_HIT" >> $RES
             T_CLEAN=$(echo $T_HIT | sed 's/0x//g')
             
             echo "🔍 2. البحث عن جدول الدوال (VTable) الذي يملك هذا الـ TypeInfo..." >> $RES
             r2 -q -c "/8 0x$T_CLEAN" "$BINARY" > vtable.txt
             
             V_HIT=$(cat vtable.txt | grep -i "hit" | head -n 1 | awk '{print $1}')
             
             if [ ! -z "$V_HIT" ]; then
                echo "✅ تم العثور على VTable (جدول الكلاس الحقيقي) في: $V_HIT" >> $RES
                echo "🔥 استخراج دوال هذا الكلاس (هذه هي الـ Offsets الحقيقية!):" >> $RES
                echo "---------------------------------------------------" >> $RES
                
                # طباعة 20 مؤشر من جدول الدوال (هذه هي العناوين التي سنعدل عليها)
                r2 -q -c "pxq 160 @ $V_HIT" "$BINARY" >> $RES
             else
                echo "❌ لم يتم العثور على VTable." >> $RES
             fi
          else
             echo "❌ لم يتم العثور على TypeInfo. (سنقوم ببحث بديل شامل)" >> $RES
             r2 -q -c "aaa; axt 0x$ADDR" "$BINARY" >> $RES
          fi
          
          cat $RES


      - name: 5. Upload Final XREFs
        uses: actions/upload-artifact@v4
        with:
          name: Sniper-XREF-Results
          path: Sniper_Results/
